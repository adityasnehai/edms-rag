<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f48d16" />

    <!-- SEO -->
    <title>MemoStack</title>
    <meta name="description" content="MemoStack turns ADRs, RFCs, postmortems, tickets, and notes into cited decision memory for engineering and product teams." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MemoStack" />
    <meta property="og:description" content="Turn scattered engineering records into source-backed answers your team can verify." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://edms.app" />
    <meta property="og:site_name" content="MemoStack" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MemoStack" />
    <meta name="twitter:description" content="Turn scattered engineering records into source-backed answers your team can verify." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts — preconnect first, then stylesheet (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MemoStack",
        "description": "Team knowledge search with cited answers for engineering decisions and incidents.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
