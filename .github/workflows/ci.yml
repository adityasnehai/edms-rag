name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edms
    env:
      ALLOW_DOTENV: "0"
      APP_ENV: development
      JWT_SECRET: ci-only-jwt-secret-not-used-in-production-at-all
      DATABASE_URL: sqlite:///data/ci.db
      REDIS_URL: ""
      CELERY_BROKER_URL: ""
      CELERY_RESULT_BACKEND: ""
      VECTOR_BACKEND: pinecone
      LEXICAL_BACKEND: local_bm25
      OBJECT_STORAGE_BACKEND: local
      OPENAI_API_KEY: test-openai-key
      PINECONE_API_KEY: test-pinecone-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('edms/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall src

      - name: Import backend app
        run: python -c "import sys; sys.path.insert(0, '.'); import src.api.main; print('backend import ok')"

      - name: Smoke test backend
        run: |
          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8019 > /tmp/edms-ci.log 2>&1 &
          server_pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8019/live >/dev/null && curl -fsS http://127.0.0.1:8019/ready >/dev/null; then
              kill $server_pid
              wait $server_pid || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/edms-ci.log
          kill $server_pid || true
          wait $server_pid || true
          exit 1

      - name: Build backend Docker image
        run: docker build -t edms-backend-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edms-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: edms-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
