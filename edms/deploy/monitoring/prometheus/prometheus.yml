global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: edms-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: celery-flower
    static_configs:
      - targets: ["flower:5555"]
