upstream edms_api {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://edms_api;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /readyz {
        proxy_pass http://edms_api/ready;
    }
}
